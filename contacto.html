<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraTech | Contáctanos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <!-- HEADER -->
  <header>
    <div class="logo" onclick="window.location.href='index.html'">
      <img src="images/Presentación_Empresarial_Tecnología_Inteligencia_Artificial_Digital_Moderno_Azul_Oscuro-removebg-preview.png" alt="Logo AuraTech">
      <h1>AuraTech</h1>
    </div>

    <div class="buscador">
      <div class="buscador-input">
        <input type="text" placeholder="Buscar productos...">
        <button><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
    </div>

    <div class="usuario">
      <a href="login.html">Inicia Sesión</a>
      <!-- 🛒 CARRITO DE COMPRAS -->
<div class="carrito">
  <img src="https://cdn-icons-png.flaticon.com/512/263/263142.png" alt="Carrito" class="icono-carrito">

  <!-- 🔽 MENÚ DESPLEGABLE DEL CARRITO -->
  <div class="dropdown-carrito">
    <table>
      <thead>
        <tr>
          <th>Imagen</th>
          <th>Descripción</th>
          <th>Precio</th>
          <th>Cantidad</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="cart-items">
        <tr><td colspan="5" class="empty">Carrito vacío</td></tr>
      </tbody>
    </table>
    <div class="cart-total">Total: S/ 0.00</div>
  </div>
</div>

  </header>

  <!-- NAV -->
  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="componentes.html">Componentes</a></li>
      <li><a href="#">Ofertas</a></li>
      <li><a href="contacto.html" class="activo">Contacto</a></li>
    </ul>
  </nav>

  <!-- FORMULARIO DE CONTACTO -->
  <section class="contacto-section">
    <h2>📩 Formulario de Contacto</h2>

    <form class="form-contacto" id="form-contacto">
      <div class="form-grupo">
        <label for="local">Local</label>
        <select id="local" required>
          <option value="">Seleccionar local</option>
          <option value="lima">Lima</option>
          <option value="arequipa">Arequipa</option>
          <option value="cusco">Cusco</option>
        </select>
      </div>

      <div class="form-grupo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required>
      </div>

      <div class="form-grupo">
        <label for="celular">Celular</label>
        <input type="tel" id="celular" placeholder="Tu número de celular" required>
      </div>

      <div class="form-grupo">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="ejemplo@gmail.com" required>
      </div>

      <div class="form-grupo mensaje">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
      </div>

      <button type="submit" class="btn-enviar">Enviar Mensaje</button>
    </form>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>*Imágenes referenciales. Aplican términos y condiciones.</p>
    <p>© 2025 AuraTech - Todos los derechos reservados.</p>
  </footer>

  <!-- SCRIPT -->
  <script>
    // ✅ Mostrar mensaje al enviar
    document.getElementById('form-contacto').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('✅ ¡Gracias! Tu mensaje ha sido enviado correctamente.');
      this.reset();
    });
  </script>
  <script src="script.js"></script>

</body>
</html>
